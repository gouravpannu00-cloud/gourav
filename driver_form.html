{% extends "base.html" %}

{% block content %}

<h1 class="page-title">

{% if edit %}

✏️ Edit Driver

{% else %}

👨‍✈️ Add Driver

{% endif %}

</h1>


<form
class="form-box"
method="POST"
enctype="multipart/form-data">


<label>
Driver Name
</label>

<input
name="name"
value="{{ driver.name if driver else '' }}"
required>


<label>
Mobile
</label>

<input
name="mobile"
value="{{ driver.mobile if driver else '' }}">


<label>
Driving License Number
</label>

<input
name="license_no"
value="{{ driver.license_no if driver else '' }}">


<label>
Address
</label>

<textarea name="address">{{ driver.address if driver else '' }}</textarea>


{% if not edit %}

<label>
Driving License Document
</label>

<input
type="file"
name="license_file">


<label>
Driver Photo
</label>

<input
type="file"
name="photo_file">

{% endif %}


<button
class="button"
type="submit">

Save Driver

</button>

</form>

{% endblock %}
