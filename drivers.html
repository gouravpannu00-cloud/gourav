{% extends "base.html" %}

{% block content %}

<div class="page-header">

<h1>
👨‍✈️ Driver Management
</h1>

<a class="button"
href="{{ url_for('add_driver') }}">

+ Add Driver

</a>

</div>


<div class="table-container">

<table>

<thead>

<tr>

<th>Name</th>

<th>Mobile</th>

<th>License No.</th>

<th>Address</th>

<th>Action</th>

</tr>

</thead>


<tbody>

{% for driver in drivers %}

<tr>

<td>
{{ driver.name }}
</td>

<td>
{{ driver.mobile }}
</td>

<td>
{{ driver.license_no }}
</td>

<td>
{{ driver.address }}
</td>

<td>

<a class="edit"
href="{{ url_for(
    'edit_driver',
    driver_id=driver.id
) }}">

Edit

</a>


<a class="delete"
href="{{ url_for(
    'delete_driver',
    driver_id=driver.id
) }}"
onclick="return confirm(
'Delete this driver?'
)">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
